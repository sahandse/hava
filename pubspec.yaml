name: hava
description: اپلیکیشن هواشناسی فارسی، مینیمال و مبتنی بر داده واقعی.
publish_to: "none"
version: 0.3.0+3

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.8.0+1
  intl: ^0.20.2
  shamsi_date: ^1.0.4
  geolocator: ^14.0.2
  shared_preferences: ^2.5.3
  connectivity_plus: ^7.0.0
  flutter_riverpod: ^3.0.0
  dynamic_color: ^1.8.1
  webview_flutter: ^4.13.0
  flutter_local_notifications: ^22.3.1
  workmanager: ^0.10.0+1
  home_widget: ^0.9.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
