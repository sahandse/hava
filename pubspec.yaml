name: hava
description: اپلیکیشن هواشناسی فارسی، مینیمال و مبتنی بر داده واقعی.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.8.0+1
  intl: ^0.20.2
  shamsi_date: ^1.0.4
  geolocator: ^14.0.2
  shared_preferences: ^2.5.3
  connectivity_plus: ^7.0.0
  flutter_riverpod: ^3.0.0
  go_router: ^16.2.4
  dynamic_color: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
